name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'shared/**'
      - 'drizzle/schema.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy trpc --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy stripe-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy handle-signup --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Edge function runtime secrets (STRIPE_*, ADMIN_EMAIL, etc.) are managed
      # directly on the Supabase project (dashboard or `supabase secrets set`).
      # SUPABASE_URL / SUPABASE_*_KEY / SUPABASE_DB_URL are injected automatically
      # by the platform and cannot be set via `supabase secrets set` (the CLI rejects
      # the reserved prefix: "Env name cannot start with SUPABASE_").
      #
      # Because of that, the database URL the app actually uses is APP_DB_URL, set as a
      # project secret. It must point at the Supavisor SESSION-mode pooler (port 5432 on
      # the *.pooler.supabase.com host): the platform-injected SUPABASE_DB_URL is not the
      # right target, and postgres.js deadlocks against transaction mode (6543) whenever a
      # query has to wait for a pooled connection. See shared/db-options.ts.
